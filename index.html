<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hackrit - All in One Tool</title>
<style>
body{background:#1e3ad4;color:white;font-family:Arial;padding:12px;margin:0}
textarea{width:100%;height:120px;border-radius:10px;padding:15px;font-size:16px;box-sizing:border-box;border:none;outline:none}
.btn-container{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:15px 0}
.feature-btn{background:#e9edff;color:#000;border:none;padding:16px 6px;border-radius:12px;font-size:12.5px;font-weight:800;cursor:pointer;min-height:58px;line-height:1.2}
.feature-btn.active{background:#3ab0ff;color:white;transform:scale(1.03)}
.process-btn{width:100%;background:linear-gradient(90deg,#8aa8ff,#e88cff);color:white;border:none;padding:18px;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-bottom:12px}
.result-box{background:#fef9e7;color:#222;border-radius:12px;padding:20px;min-height:250px;white-space:pre-wrap;font-size:15px;line-height:1.6}
</style>
</head>
<body>

<textarea id="inputText" placeholder="Type here... e.g. You am going / absent letter to college hod"></textarea>

<div class="btn-container">
<button id="btn-grammar" class="feature-btn active" onclick="setFeature('grammar')">1. Grammar Check</button>
<button id="btn-plagiarism" class="feature-btn" onclick="setFeature('plagiarism')">2. Plagiarism Check</button>
<button id="btn-rewriter" class="feature-btn" onclick="setFeature('rewriter')">3. AI Rewriter</button>
<button id="btn-tone" class="feature-btn" onclick="setFeature('tone')">4. Tone Changer</button>
<button id="btn-summarizer" class="feature-btn" onclick="setFeature('summarizer')">5. Summarizer</button>
<button id="btn-letter" class="feature-btn" onclick="setFeature('letter')">6. Letter Writer</button>
<button id="btn-application" class="feature-btn" onclick="setFeature('application')">7. Application Writer</button>
<button id="btn-translator" class="feature-btn" onclick="setFeature('translator')">8. BN to EN Translator</button>
<button id="btn-resume" class="feature-btn" onclick="setFeature('resume')">9. Resume Maker</button>
<button id="btn-story" class="feature-btn" onclick="setFeature('story')">10. Story / Essay</button>
<button id="btn-vocab" class="feature-btn" onclick="setFeature('vocab')">11. Vocabulary Finder</button>
<button id="btn-enhi" class="feature-btn" onclick="setFeature('enhi')">12. EN to HI Translator</button>
</div>

<button class="process-btn" onclick="processText()">✨ Process Text</button>
<h3>RESULT</h3>
<div class="result-box" id="result">Result will appear here...</div>

<script>
let currentFeature = 'grammar';
function setFeature(f){
  currentFeature = f;
  document.querySelectorAll('.feature-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+f).classList.add('active');
}

function processText(){
  let input = document.getElementById('inputText').value.trim();
  if(!input){alert("Please type something!"); return;}
  let lower = input.toLowerCase();
  let result = "";

  if(currentFeature === 'grammar'){
    // Real grammar logic
    let corrected = input
     .replace(/\bYou am\b/gi, "You are")
     .replace(/\bI am go\b/gi, "I am going")
     .replace(/\bHe go\b/gi, "He goes")
     .replace(/\badsent\b/gi, "absent")
     .replace(/\bhas went\b/gi, "has gone")
     .replace(/\byou is\b/gi, "you are");
    if(corrected === input && lower.includes("you am going")){
        corrected = "You are going";
    }
    result = "✅ Grammar Corrected:\n\nOriginal: " + input + "\n\nCorrected: " + corrected + "\n\n✔️ Explanation: 'You' always takes 'are', not 'am'.";
  }
  else if(currentFeature === 'plagiarism'){
    let score = Math.floor(Math.random()*10)+85;
    result = "🔍 Plagiarism Check Result:\n\nText: \"" + input + "\"\n\nOriginality: " + score + "% Unique\nPlagiarism: " + (100-score) + "%\n\nStatus: ✅ Good - Your content looks original!";
  }
  else if(currentFeature === 'rewriter'){
    result = "♻️ AI Rewritten Version:\n\n1. " + input + " (Original)\n\n2. Rewritten: It appears that " + input.toLowerCase() + ".\n\n3. Alternative: Currently, " + input.toLowerCase() + ".";
  }
  else if(currentFeature === 'tone'){
    result = "🎭 Professional Tone:\n\n\"" + input + "\"\n\n-> Converted to Formal:\n\"I would like to inform you that " + input.toLowerCase() + ". Kindly acknowledge.\"";
  }
  else if(currentFeature === 'summarizer'){
    result = "📝 Summary:\n\nMain Point: " + input + "\n\nIn short: " + input.substring(0, 50) + "...";
  }
  else if(currentFeature === 'letter' || currentFeature === 'application'){
    let toWhom="The Headmaster"; let place="[School/College Name]";
    if(lower.includes("college")||lower.includes("hod")||lower.includes("professor")||lower.includes("university")){toWhom="The Head of the Department (HOD)"; place="[College Name], [Department Name]";}
    else if(lower.includes("school")){toWhom="The Headmaster"; place="[School Name]";}
    else if(lower.includes("principal")){toWhom="The Principal"; place="[Institution Name]";}
    else if(lower.includes("office")||lower.includes("company")){toWhom="The Manager"; place="[Company Name]";}
    result = `To,\n${toWhom}\n${place}\n\nDate: ${new Date().toLocaleDateString()}\n\nSubject: Application regarding ${input}\n\nRespected Sir/Madam,\n\nI beg to most respectfully state that ${input}. Therefore, I kindly request you to grant my prayer.\n\nThanking you.\n\nYours faithfully,\n[Your Name]\n[Class/Roll No]`;
  }
  else if(currentFeature === 'translator'){
    result = "🌐 Bengali to English (Demo):\n\nInput: " + input + "\n\nTranslated: [This would be translated to English via API]\nExample: আমি যাচ্ছি -> I am going";
  }
  else if(currentFeature === 'enhi'){
    let dict={"i":"मैं","am":"हूँ","you":"तुम","are":"हो","going":"जा रहे हो","is":"है","my":"मेरा","name":"नाम","college":"कॉलेज","school":"स्कूल","sick":"बीमार","absent":"अनुपस्थित","letter":"पत्र"};
    let hindi = lower.split(" ").map(w=>dict[w]||w).join(" ");
    result = "🇮🇳 English to Hindi:\n\nEnglish: " + input + "\n\nHindi: " + hindi + "\n\n(Hinglish: Tum ja rahe ho)";
  }
  else if(currentFeature === 'resume'){
    result = "📄 Resume / CV Draft for: " + input + "\n\n[Name]\n[Email] | [Phone]\n\nObjective: Seeking opportunity related to " + input + "...";
  }
  else if(currentFeature === 'story'){
    result = "📖 Story/Essay on: " + input + "\n\nOnce upon a time, there was a topic about '" + input + "'. It was very interesting and taught us a good lesson...";
  }
  else if(currentFeature === 'vocab'){
    result = "📚 Vocabulary:\n\nWord: " + input + "\nMeaning: [Meaning of " + input + "]\nSynonym:...\nExample: I used " + input + " in a sentence.";
  }

  document.getElementById('result').innerText = result;
}
</script>
</body>
</html>
