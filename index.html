<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackrit - All in One Tool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e3ad4;
            color: white;
            padding: 12px;
            margin: 0;
        }
        textarea {
            width: 100%;
            height: 120px;
            border-radius: 10px;
            padding: 15px;
            font-size: 16px;
            border: none;
            outline: none;
            box-sizing: border-box;
            font-weight: 500;
        }
      .btn-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }
      .feature-btn {
            background: #e9edff;
            color: #1a1a1a;
            border: none;
            padding: 16px 8px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            line-height: 1.2;
            min-height: 55px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
      .feature-btn.active {
            background: #3ab0ff;
            color: white;
            transform: scale(1.02);
        }
      .process-btn {
            width: 100%;
            background: linear-gradient(90deg, #8aa8ff, #e88cff);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
        }
      .result-box {
            background: #fef9e7;
            color: #333;
            border-radius: 12px;
            padding: 20px;
            min-height: 250px;
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <textarea id="inputText" placeholder="absent letter to college hod"></textarea>

    <div class="btn-container">
        <button class="feature-btn" onclick="setFeature('grammar',this)">1. Grammar Check</button>
        <button class="feature-btn" onclick="setFeature('plagiarism',this)">2. Plagiarism Check</button>
        <button class="feature-btn" onclick="setFeature('rewriter',this)">3. AI Rewriter</button>
        <button class="feature-btn" onclick="setFeature('tone',this)">4. Tone Changer</button>
        <button class="feature-btn" onclick="setFeature('summarizer',this)">5. Summarizer</button>
        <button class="feature-btn" onclick="setFeature('letter',this)">6. Letter Writer</button>
        <button class="feature-btn active" onclick="setFeature('application',this)">7. Application Writer</button>
        <button class="feature-btn" onclick="setFeature('translator',this)">8. BN to EN Translator</button>
        <button class="feature-btn" onclick="setFeature('resume',this)">9. Resume Maker</button>
        <button class="feature-btn" onclick="setFeature('story',this)">10. Story / Essay</button>
        <button class="feature-btn" onclick="setFeature('vocab',this)">11. Vocabulary Finder</button>
        <button class="feature-btn" onclick="setFeature('enhi',this)">12. EN to HI Translator</button>
    </div>

    <button class="process-btn" onclick="processText()">✨ Process Text</button>

    <h3>RESULT</h3>
    <div class="result-box" id="result">Result will appear here...</div>

<script>
    let currentFeature = 'application';
    function setFeature(f, el){
        currentFeature=f;
        document.querySelectorAll('.feature-btn').forEach(b=>b.classList.remove('active'));
        el.classList.add('active');
    }
    function processText(){
        let input=document.getElementById('inputText').value.trim();
        if(!input) return alert("Text লেখো");
        let lower=input.toLowerCase();
        let result="";
        if(currentFeature==='letter' || currentFeature==='application'){
            let toWhom="The Headmaster"; let place="[School Name]";
            if(lower.includes("college")||lower.includes("hod")||lower.includes("professor")||lower.includes("department")||lower.includes("university")){
                toWhom="The Head of the Department (HOD)"; place="[College Name], [Department Name]";
            }else if(lower.includes("school")){toWhom="The Headmaster"; place="[School Name]";}
            else if(lower.includes("principal")){toWhom="The Principal"; place="[Institution Name]";}
            else if(lower.includes("office")||lower.includes("company")){toWhom="The Manager"; place="[Company Name]";}
            result=`To,\n${toWhom}\n${place}\n\nDate: ${new Date().toLocaleDateString()}\nSubject: Application for ${input}\n\nRespected Sir,\n\nI beg to state that ${input}. Kindly grant my request.\n\nYours faithfully,\n[Your Name]`;
        }else if(currentFeature==='enhi'){
            let dict={"i":"मैं","am":"हूँ","sick":"बीमार","absent":"अनुपस्थित","college":"कॉलेज"};
            let hindi=lower.split(" ").map(w=>dict[w]||w).join(" ");
            result="🇮🇳 EN to HI:\n\nEnglish: "+input+"\n\nHindi: "+hindi;
        }else{
            result="Result for "+currentFeature+":\n\n"+input;
        }
        document.getElementById('result').innerText=result;
    }
</script>
</body>
</html>
