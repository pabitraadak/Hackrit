<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>LexiCorrect Pro</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #33215f 0%, transparent 35%),
        radial-gradient(circle at bottom right, #142c58 0%, transparent 35%),
        #090b18;
      color: #ffffff;
      padding: 25px;
    }

    .container {
      max-width: 1150px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 38px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      color: #b7bdd6;
      font-size: 15px;
    }

    .glass {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(15px);
      border-radius: 20px;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      padding: 12px;
      margin-bottom: 20px;
    }

    .feature-btn {
      border: none;
      padding: 13px 8px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      color: #d8dcf5;
      cursor: pointer;
      transition: 0.25s;
      font-size: 13px;
    }

    .feature-btn:hover {
      background: rgba(255, 255, 255, 0.13);
      transform: translateY(-2px);
    }

    .feature-btn.active {
      background: linear-gradient(135deg, #6d4aff, #3b82f6);
      color: white;
    }

    .workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .panel {
      padding: 22px;
    }

    .panel h2 {
      font-size: 20px;
      margin-bottom: 7px;
    }

    .description {
      color: #9da5c6;
      font-size: 13px;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      min-height: 300px;
      resize: vertical;
      border: 1px solid rgba(255, 255, 255, 0.12);
      outline: none;
      border-radius: 14px;
      padding: 16px;
      background: rgba(0, 0, 0, 0.22);
      color: white;
      font-size: 15px;
      line-height: 1.6;
    }

    textarea::placeholder {
      color: #707795;
    }

    textarea:focus {
      border-color: #7c6cff;
      box-shadow: 0 0 0 2px rgba(124, 108, 255, 0.12);
    }

    .counter {
      display: flex;
      justify-content: space-between;
      color: #858cab;
      font-size: 12px;
      margin-top: 8px;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    select,
    .process-btn,
    .copy-btn {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      cursor: pointer;
    }

    select {
      background: #171a31;
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .process-btn {
      flex: 1;
      background: linear-gradient(135deg, #6d4aff, #3b82f6);
      color: white;
      font-weight: bold;
    }

    .process-btn:hover {
      opacity: 0.9;
    }

    .process-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.17);
    }

    .status {
      min-height: 22px;
      margin-top: 14px;
      color: #9da5c6;
      font-size: 13px;
    }

    .output {
      min-height: 300px;
      padding: 16px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.12);
      white-space: pre-wrap;
      overflow-wrap: break-word;
      color: #e8ebff;
      line-height: 1.7;
      font-size: 15px;
    }

    .result-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 13px;
      margin-bottom: 10px;
      border-left: 3px solid #7c6cff;
    }

    .result-card strong {
      color: #a78bfa;
    }

    .tone-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .tone-btn {
      border: none;
      background: rgba(255, 255, 255, 0.08);
      color: #dddff5;
      padding: 9px 13px;
      border-radius: 8px;
      cursor: pointer;
    }

    .tone-btn.active {
      background: #624cff;
      color: white;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #747b9b;
      font-size: 12px;
    }

    @media (max-width: 900px) {
      .features {
        grid-template-columns: repeat(3, 1fr);
      }

      .workspace {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .header h1 {
        font-size: 28px;
      }

      .features {
        grid-template-columns: repeat(2, 1fr);
      }

      .panel {
        padding: 15px;
      }

      textarea,
      .output {
        min-height: 250px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header class="header">
      <h1>LexiCorrect Pro</h1>
      <p>Smart writing assistance for clearer, better English</p>
    </header>

    <!-- FIVE FEATURES -->
    <div class="features glass">

      <button class="feature-btn active" onclick="setMode('grammar', this)">
        Grammar Check
      </button>

      <button class="feature-btn" onclick="setMode('rewrite', this)">
        Smart Rewriter
      </button>

      <button class="feature-btn" onclick="setMode('tone', this)">
        Tone Changer
      </button>

      <button class="feature-btn" onclick="setMode('summary', this)">
        Summarizer
      </button>

      <button class="feature-btn" onclick="setMode('vocabulary', this)">
        Vocabulary
      </button>

    </div>

    <div class="workspace">

      <!-- INPUT PANEL -->
      <section class="panel glass">

        <h2 id="modeTitle">Grammar Check</h2>

        <p class="description" id="modeDescription">
          Find common grammar and writing errors using LanguageTool.
        </p>

        <textarea
          id="inputText"
          placeholder="Enter your text here..."
          oninput="updateCounter()"
        ></textarea>

        <div class="counter">
          <span id="wordCount">0 words</span>
          <span id="charCount">0 characters</span>
        </div>

        <div id="extraControls"></div>

        <div class="controls">

          <button
            class="process-btn"
            id="processBtn"
            onclick="processText()"
          >
            Check Grammar
          </button>

        </div>

        <div class="status" id="status"></div>

      </section>


      <!-- OUTPUT PANEL -->
      <section class="panel glass">

        <h2>Result</h2>

        <p class="description">
          Your processed result will appear here.
        </p>

        <div class="output" id="output">
          Your result will appear here...
        </div>

        <div class="controls">

          <button
            class="copy-btn"
            onclick="copyOutput()"
          >
            Copy Result
          </button>

        </div>

      </section>

    </div>

    <div class="footer">
      LexiCorrect Pro • Hackathon Project
    </div>

  </div>


<script>

  /* =========================================================
     GLOBAL STATE
  ========================================================= */

  let currentMode = "grammar";
  let currentTone = "formal";


  /* =========================================================
     FEATURE INFORMATION
  ========================================================= */

  const modes = {

    grammar: {
      title: "Grammar Check",
      description:
        "Find common grammar and writing errors using LanguageTool.",
      button:
        "Check Grammar",
      placeholder:
        "Example: She go to school every day."
    },

    rewrite: {
      title: "Smart Rewriter",
      description:
        "Rewrite text using lightweight JavaScript-based language rules.",
      button:
        "Rewrite Text",
      placeholder:
        "Example: This project is very good and very important."
    },

    tone: {
      title: "Tone Changer",
      description:
        "Change the writing style into Formal, Casual, or Professional tone.",
      button:
        "Change Tone",
      placeholder:
        "Example: Hey, I need your help with this thing."
    },

    summary: {
      title: "Summarizer",
      description:
        "Create an extractive summary by scoring important sentences.",
      button:
        "Summarize",
      placeholder:
        "Enter a paragraph or multiple sentences to summarize."
    },

    vocabulary: {
      title: "Vocabulary",
      description:
        "Look up the meaning and word information using a dictionary API.",
      button:
        "Check Word",
      placeholder:
        "Example: resilient"
    }

  };


  /* =========================================================
     CHANGE FEATURE
  ========================================================= */

  function setMode(mode, buttonElement) {

    currentMode = mode;

    const info = modes[mode];

    document.getElementById("modeTitle").textContent = info.title;

    document.getElementById("modeDescription").textContent =
      info.description;

    document.getElementById("processBtn").textContent =
      info.button;

    document.getElementById("inputText").placeholder =
      info.placeholder;

    document.getElementById("output").textContent =
      "Your result will appear here...";

    document.getElementById("status").textContent = "";

    document.querySelectorAll(".feature-btn").forEach(btn => {
      btn.classList.remove("active");
    });

    if (buttonElement) {
      buttonElement.classList.add("active");
    }

    createExtraControls();
  }


  /* =========================================================
     EXTRA CONTROLS
  ========================================================= */

  function createExtraControls() {

    const container =
      document.getElementById("extraControls");

    container.innerHTML = "";

    if (currentMode === "tone") {

      container.innerHTML = `
        <div class="tone-buttons">

          <button
            class="tone-btn active"
            onclick="selectTone('formal', this)"
          >
            Formal
          </button>

          <button
            class="tone-btn"
            onclick="selectTone('casual', this)"
          >
            Casual
          </button>

          <button
            class="tone-btn"
            onclick="selectTone('professional', this)"
          >
            Professional
          </button>

        </div>
      `;
    }
  }


  function selectTone(tone, buttonElement) {

    currentTone = tone;

    document.querySelectorAll(".tone-btn").forEach(btn => {
      btn.classList.remove("active");
    });

    buttonElement.classList.add("active");
  }


  /* =========================================================
     COUNTER
  ========================================================= */

  function updateCounter() {

    const text =
      document.getElementById("inputText").value.trim();

    const words =
      text ? text.split(/\s+/).length : 0;

    const characters =
      document.getElementById("inputText").value.length;

    document.getElementById("wordCount").textContent =
      `${words} words`;

    document.getElementById("charCount").textContent =
      `${characters} characters`;
  }


  /* =========================================================
     MAIN PROCESS FUNCTION
  ========================================================= */

  async function processText() {

    const input =
      document.getElementById("inputText").value.trim();

    const output =
      document.getElementById("output");

    const status =
      document.getElementById("status");

    const button =
      document.getElementById("processBtn");


    if (!input) {

      output.textContent =
        "Please enter some text first.";

      status.textContent =
        "No input provided.";

      return;
    }


    button.disabled = true;

    button.textContent = "Processing...";

    status.textContent =
      "Processing your request...";


    try {

      if (currentMode === "grammar") {

        await grammarCheck(input);

      }

      else if (currentMode === "rewrite") {

        const result =
          smartRewrite(input);

        output.textContent =
          result;

        status.textContent =
          "Text rewritten successfully.";

      }

      else if (currentMode === "tone") {

        const result =
          changeTone(input, currentTone);

        output.textContent =
          result;

        status.textContent =
          "Tone changed successfully.";

      }

      else if (currentMode === "summary") {

        const result =
          summarizeText(input);

        output.textContent =
          result;

        status.textContent =
          "Summary generated successfully.";

      }

      else if (currentMode === "vocabulary") {

        await vocabularyLookup(input);

      }

    }

    catch (error) {

      console.error(error);

      output.textContent =
        "Something went wrong. Please try again.";

      status.textContent =
        "An error occurred while processing.";

    }

    finally {

      button.disabled = false;

      button.textContent =
        modes[currentMode].button;

    }
  }


  /* =========================================================
     1. GRAMMAR CHECK
  ========================================================= */

  async function grammarCheck(text) {

    const output =
      document.getElementById("output");

    const status =
      document.getElementById("status");


    status.textContent =
      "Sending text to LanguageTool...";


    const params =
      new URLSearchParams();

    params.append("text", text);

    params.append("language", "en-US");


    const response = await fetch(
      "https://api.languagetool.org/v2/check",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded"
        },

        body: params.toString()
      }
    );


    if (!response.ok) {
      throw new Error(
        "LanguageTool API request failed."
      );
    }


    const data =
      await response.json();


    const matches =
      data.matches || [];


    if (matches.length === 0) {

      output.innerHTML = `
        <div class="result-card">
          <strong>No major issues found.</strong><br>
          Your text looks good according to the grammar service.
        </div>
      `;

      status.textContent =
        "Grammar check completed.";

      return;
    }


    /*
      We sort matches from the end of the sentence
      to the beginning before applying replacements.

      This prevents character positions from shifting.
    */

    const sortedMatches =
      [...matches].sort(
        (a, b) => b.offset - a.offset
      );


    let correctedText = text;


    sortedMatches.forEach(match => {

      if (
        match.replacements &&
        match.replacements.length > 0
      ) {

        const replacement =
          match.replacements[0].value;

        correctedText =
          correctedText.slice(
            0,
            match.offset
          ) +

          replacement +

          correctedText.slice(
            match.offset + match.length
          );
      }

    });


    let html = `
      <div class="result-card">
        <strong>Corrected Text:</strong><br><br>
        ${escapeHTML(correctedText)}
      </div>
    `;


    html += `
      <div class="result-card">
        <strong>Suggestions:</strong><br><br>
    `;


    matches.forEach((match, index) => {

      const suggestion =
        match.replacements &&
        match.replacements.length
          ? match.replacements[0].value
          : "No replacement available";


      html += `
        ${index + 1}. ${escapeHTML(
          match.message
        )}<br>
        <small>
          Suggested: ${escapeHTML(suggestion)}
        </small>
        <br><br>
      `;

    });


    html += "</div>";


    output.innerHTML = html;

    status.textContent =
      `${matches.length} possible issue(s) found.`;
  }


  /* =========================================================
     2. SMART REWRITER
  ========================================================= */

  function smartRewrite(text) {

    let result =
      text;


    const replacements = [

      [/\bvery good\b/gi, "excellent"],

      [/\bvery bad\b/gi, "poor"],

      [/\bvery important\b/gi, "essential"],

      [/\ba lot of\b/gi, "many"],

      [/\bI want to\b/gi, "I would like to"],

      [/\bI need to\b/gi, "I would like to"],

      [/\bhelp\b/gi, "assist"],

      [/\buse\b/gi, "utilize"],

      [/\bstart\b/gi, "begin"],

      [/\bshow\b/gi, "demonstrate"]

    ];


    replacements.forEach(
      ([pattern, replacement]) => {

        result =
          result.replace(
            pattern,
            replacement
          );

      }
    );


    /*
      Remove repeated spaces.
    */

    result =
      result.replace(
        /\s+/g,
        " "
      ).trim();


    return result;
  }


  /* =========================================================
     3. TONE CHANGER
  ========================================================= */

  function changeTone(text, tone) {

    let result =
      text;


    if (tone === "formal") {

      const replacements = [

        [/\bhey\b/gi, "Hello"],

        [/\bhi\b/gi, "Hello"],

        [/\bthanks\b/gi, "Thank you"],

        [/\bthanks a lot\b/gi, "Thank you very much"],

        [/\bI want\b/gi, "I would like"],

        [/\bcan you\b/gi, "Could you"],

        [/\bhelp me\b/gi, "assist me"],

        [/\bneed\b/gi, "require"]

      ];


      replacements.forEach(
        ([pattern, replacement]) => {

          result =
            result.replace(
              pattern,
              replacement
            );

        }
      );

    }


    else if (tone === "casual") {

      const replacements = [

        [/\bHello\b/g, "Hey"],

        [/\bThank you\b/gi, "Thanks"],

        [/\bI would like\b/gi, "I want"],

        [/\bCould you\b/gi, "Can you"],

        [/\bassistance\b/gi, "help"]

      ];


      replacements.forEach(
        ([pattern, replacement]) => {

          result =
            result.replace(
              pattern,
              replacement
            );

        }
      );

    }


    else if (tone === "professional") {

      const replacements = [

        [/\bhey\b/gi, "Hello"],

        [/\bhi\b/gi, "Hello"],

        [/\bthanks\b/gi, "Thank you"],

        [/\bI want\b/gi, "I would like"],

        [/\bcan you\b/gi, "Could you please"],

        [/\bhelp me\b/gi, "assist me"],

        [/\bthing\b/gi, "matter"]

      ];


      replacements.forEach(
        ([pattern, replacement]) => {

          result =
            result.replace(
              pattern,
              replacement
            );

        }
      );

    }


    return result;
  }


  /* =========================================================
     4. EXTRACTIVE SUMMARIZER
  ========================================================= */

  function summarizeText(text) {

    const sentences =
      text
        .match(/[^.!?]+[.!?]+|[^.!?]+$/g);


    if (!sentences || sentences.length <= 2) {

      return text;
    }


    const stopWords = new Set([

      "the", "is", "a", "an", "and",
      "or", "of", "to", "in", "on",
      "for", "with", "that", "this",
      "it", "as", "are", "was", "were",
      "be", "by", "from", "at", "which",
      "has", "have", "had", "but", "not",
      "they", "their", "them", "he",
      "she", "his", "her", "we", "our",
      "you", "your", "i"

    ]);


    const wordFrequency = {};


    /*
      Step 1:
      Count important words.
    */

    sentences.forEach(sentence => {

      const words =
        sentence
          .toLowerCase()
          .match(/[a-z]+/g) || [];


      words.forEach(word => {

        if (
          word.length > 2 &&
          !stopWords.has(word)
        ) {

          wordFrequency[word] =
            (wordFrequency[word] || 0) + 1;

        }

      });

    });


    /*
      Step 2:
      Score every sentence.
    */

    const scored =
      sentences.map(
        (sentence, index) => {

          const words =
            sentence
              .toLowerCase()
              .match(/[a-z]+/g) || [];


          let score = 0;


          words.forEach(word => {

            if (wordFrequency[word]) {

              score +=
                wordFrequency[word];

            }

          });


          /*
            Slight bonus for earlier sentences.
            This helps preserve context.
          */

          score +=
            Math.max(
              0,
              3 - index * 0.2
            );


          return {
            sentence,
            score,
            index
          };

        }
      );


    /*
      Step 3:
      Select roughly 40% of sentences.
    */

    const numberToSelect =
      Math.max(
        1,
        Math.ceil(
          sentences.length * 0.4
        )
      );


    const selected =
      scored
        .sort(
          (a, b) =>
            b.score - a.score
        )
        .slice(
          0,
          numberToSelect
        );


    /*
      Step 4:
      Restore original order.
    */

    selected.sort(
      (a, b) =>
        a.index - b.index
    );


    return selected
      .map(item => item.sentence.trim())
      .join(" ");
  }


  /* =========================================================
     5. VOCABULARY
  ========================================================= */

  async function vocabularyLookup(word) {

    const output =
      document.getElementById("output");

    const status =
      document.getElementById("status");


    /*
      Vocabulary feature expects one word.
    */

    const cleanWord =
      word
        .trim()
        .split(/\s+/)[0]
        .toLowerCase();


    status.textContent =
      "Looking up the word...";


    const response =
      await fetch(
        `https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(cleanWord)}`
      );


    if (!response.ok) {

      output.textContent =
        "Word not found. Please enter a valid English word.";

      status.textContent =
        "No dictionary result found.";

      return;
    }


    const data =
      await response.json();


    if (
      !Array.isArray(data) ||
      !data[0]
    ) {

      throw new Error(
        "Invalid dictionary response."
      );

    }


    const entry =
      data[0];


    let html = `
      <div class="result-card">
        <strong>Word:</strong>
        ${escapeHTML(entry.word || cleanWord)}
      </div>
    `;


    if (entry.phonetic) {

      html += `
        <div class="result-card">
          <strong>Pronunciation:</strong><br>
          ${escapeHTML(entry.phonetic)}
        </div>
      `;

    }


    const meanings =
      entry.meanings || [];


    meanings.forEach(
      (meaning, index) => {

        html += `
          <div class="result-card">

            <strong>
              ${index + 1}. ${
                escapeHTML(
                  meaning.partOfSpeech ||
                  "Meaning"
                )
              }
            </strong>

            <br><br>
        `;


        const definitions =
          meaning.definitions || [];


        definitions
          .slice(0, 3)
          .forEach((definition, i) => {

            html += `
              ${i + 1}. ${
                escapeHTML(
                  definition.definition
                )
              }<br>
            `;


            if (definition.example) {

              html += `
                <small>
                  Example:
                  ${escapeHTML(
                    definition.example
                  )}
                </small><br>
              `;

            }


            html += "<br>";

          });


        html += "</div>";

      }
    );


    output.innerHTML =
      html;


    status.textContent =
      "Vocabulary lookup completed.";
  }


  /* =========================================================
     COPY RESULT
  ========================================================= */

  async function copyOutput() {

    const output =
      document.getElementById("output");


    const text =
      output.innerText.trim();


    if (!text) {

      return;
    }


    try {

      await navigator.clipboard.writeText(
        text
      );

      document.getElementById("status").textContent =
        "Result copied to clipboard.";

    }

    catch (error) {

      /*
        Fallback for browsers where
        Clipboard API is unavailable.
      */

      const textarea =
        document.createElement("textarea");

      textarea.value =
        text;

      document.body.appendChild(
        textarea
      );

      textarea.select();

      document.execCommand("copy");

      textarea.remove();

      document.getElementById("status").textContent =
        "Result copied to clipboard.";

    }
  }


  /* =========================================================
     SECURITY / HTML ESCAPING
  ========================================================= */

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* =========================================================
     INITIALIZE APP
  ========================================================= */

  setMode(
    "grammar",
    document.querySelector(".feature-btn")
  );

  updateCounter();

</script>

</body>
